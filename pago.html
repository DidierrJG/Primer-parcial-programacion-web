<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Online</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>
                    <a href="index.html">
                        Shop Online
                    </a>
                </li>
                <li>
                    <a href="carrito.html">
                        Carrito
                    </a>
                </li>
                <li>
                    <a href="login.html">
                        Salir
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <label for="fecha">
                Fecha:
            </label>
            <input name="fecha" type="date" id="fecha">
            <label for="numero-pedido">
                Pedido numero:
            </label>
            <input name="numero-pedido" type="text" id="numero-pedido">
            <label for="cliente">
                Cliente:
            </label>
            <input name="cliente" type="text" id="cliente">
        </section>
        <section>
            <h2>
                Relacion de Productos
            </h2>
            <table>
                <tr>
                    <th>
                        Concepto
                    </th>
                    <th>
                        Cantidad
                    </th>
                    <th>
                        Valor
                    </th>
                    <th>
                        Subtotal
                    </th>
                </tr>
            </table>
            <div>
                <p>
                    Total
                </p>
                <p id="precio-total">
                </p>
            </div>
        </section>
    </main>
</body>
<script src="js/pago.js"></script>
</html>
